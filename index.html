<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gra Matematyczna</title>
    <style>
        /* Reset i podstawy */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* Biały kontener - to musi być widoczne */
        .container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 10;
        }

        h1 { text-align: center; color: #333; margin-bottom: 20px; }

        /* Ekrany */
        #startScreen { display: block; } /* Wymuszenie widoczności startu */
        #gameScreen { display: none; }
        #endScreen { display: none; }

        /* Elementy formularza */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        
        input[type="text"], input[type="number"], select {
            width: 100%; padding: 10px;
            border: 2px solid #ddd; border-radius: 8px;
            font-size: 16px;
        }

        /* Checkboxy */
        .checkbox-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;
        }
        .chk-item {
            background: #f0f2f5; padding: 8px; border-radius: 8px;
            display: flex; align-items: center; cursor: pointer;
        }
        .chk-item:hover { background: #e2e6ea; }
        .chk-item input { margin-right: 8px; transform: scale(1.2); }

        /* Przyciski */
        button {
            width: 100%; padding: 15px; border: none; border-radius: 8px;
            font-size: 18px; font-weight: bold; color: white; cursor: pointer;
            transition: 0.2s; margin-top: 10px;
        }
        .btn-start { background: #667eea; }
        .btn-start:hover { background: #5a6fd6; }
        .btn-check { background: #28a745; margin-bottom: 10px; }
        .btn-restart { background: #667eea; }

        /* Statystyki gry */
        .stats-bar {
            display: flex; justify-content: space-between;
            background: #f8f9fa; padding: 10px; border-radius: 8px; margin-bottom: 15px;
        }
        .stat-box { text-align: center; }
        .stat-val { font-size: 20px; font-weight: bold; }

        /* Pytanie */
        .question-area {
            background: #667eea; color: white; padding: 20px;
            border-radius: 10px; text-align: center; margin-bottom: 20px;
        }
        .big-math { font-size: 32px; font-weight: bold; }
        
        /* Feedback */
        .feedback {
            text-align: center; padding: 10px; margin-bottom: 10px;
            border-radius: 5px; font-weight: bold; display: none;
        }
        .feedback.good { background: #d4edda; color: #155724; display: block; }
        .feedback.bad { background: #f8d7da; color: #721c24; display: block; }

        /* Ranking */
        .ranking-list { margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
        .rank-row {
            display: flex; justify-content: space-between; padding: 8px;
            background: #f9f9f9; margin-bottom: 5px; border-radius: 5px;
        }
        .rank-row.gold { background: #fff3cd; border: 1px solid #ffeeba; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🧮 Matematyka</h1>

        <!-- EKRAN START -->
        <div id="startScreen">
            <div class="form-group">
                <label>Twoje imię:</label>
                <input type="text" id="pName" value="Uczeń" maxlength="15">
            </div>

            <div class="form-group">
                <label>Klasa:</label>
                <select id="pClass">
                    <option value="1">Klasa 1</option>
                    <option value="2">Klasa 2</option>
                    <option value="3">Klasa 3</option>
                    <option value="4" selected>Klasa 4</option>
                    <option value="5">Klasa 5</option>
                    <option value="6">Klasa 6</option>
                    <option value="7">Klasa 7</option>
                    <option value="8">Klasa 8</option>
                </select>
            </div>

            <label>Działania:</label>
            <div class="checkbox-grid">
                <label class="chk-item"><input type="checkbox" id="c_add" checked> Dodawanie</label>
                <label class="chk-item"><input type="checkbox" id="c_sub" checked> Odejmowanie</label>
                <label class="chk-item"><input type="checkbox" id="c_mul"> Mnożenie</label>
                <label class="chk-item"><input type="checkbox" id="c_div"> Dzielenie</label>
                <label class="chk-item"><input type="checkbox" id="c_frac"> Ułamki</label>
                <label class="chk-item"><input type="checkbox" id="c_pow"> Potęgi</label>
                <label class="chk-item"><input type="checkbox" id="c_root"> Pierwiastki</label>
            </div>

            <button class="btn-start" onclick="app.init()">🚀 START</button>
        </div>

        <!-- EKRAN GRY -->
        <div id="gameScreen">
            <div class="stats-bar">
                <div class="stat-box">⏰ <span id="timer">3:00</span></div>
                <div class="stat-box">⭐ <span id="score">0</span></div>
                <div class="stat-box">🔥 <span id="streak">0</span></div>
            </div>

            <div class="question-area">
                <div class="big-math" id="qText">2 + 2 = ?</div>
                <div style="font-size: 12px; margin-top:5px; opacity:0.8" id="qType">Dodawanie</div>
            </div>

            <div id="msg" class="feedback"></div>

            <input type="number" id="ansIn" placeholder="Wpisz wynik" autocomplete="off">
            <button class="btn-check" onclick="app.check()">✅ SPRAWDŹ</button>
        </div>

        <!-- EKRAN KONIEC -->
        <div id="endScreen">
            <h2 style="text-align:center">Koniec gry!</h2>
            <p style="text-align:center; color:#666; margin-bottom:20px" id="endReason">Powód</p>
            
            <div style="text-align:center; font-size:40px; font-weight:bold; color:#667eea; margin-bottom:20px">
                <span id="finalScore">0</span> pkt
            </div>

            <div class="ranking-list">
                <h4>🏆 Ostatnie najlepsze wyniki:</h4>
                <div id="rankBox"></div>
            </div>

            <button class="btn-restart" onclick="location.reload()">🔄 ZAGRAJ PONOWNIE</button>
        </div>
    </div>

                name: ''
            },

            // Start gry
            init: function() {
