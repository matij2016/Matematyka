<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Gra Matematyczna</title>
    <style>
        body {
            font-family: sans-serif;
            background: #764ba2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 { margin-top: 0; color: #333; }

        /* Ukrywanie ekranów */
        #screen-game, #screen-end { display: none; }
        
        /* Wygląd elementów */
        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #5a6fd6; }
        
        .check-list { text-align: left; margin: 15px 0; }
        .check-item { display: block; margin: 5px 0; cursor: pointer; }
        
        .big-text { font-size: 32px; font-weight: bold; margin: 20px 0; color: #333; }
        .stats { display: flex; justify-content: space-between; font-weight: bold; color: #555; margin-bottom: 20px; }
        
        .correct { background: #d4edda; color: #155724; padding: 10px; border-radius: 5px; }
        .wrong { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="box">
        
        <!-- EKRAN 1: START -->
        <div id="screen-start">
            <h1>🧮 Matematyka</h1>
            
            <input type="text" id="inpName" placeholder="Wpisz imię" value="Gracz">
            
            <select id="selClass">
                <option value="1">Klasa 1</option>
                <option value="2">Klasa 2</option>
                <option value="3">Klasa 3</option>
                <option value="4" selected>Klasa 4</option>
                <option value="5">Klasa 5</option>
                <option value="6">Klasa 6</option>
                <option value="7">Klasa 7</option>
                <option value="8">Klasa 8</option>
            </select>

            <div class="check-list">
                <label class="check-item"><input type="checkbox" id="cAdd" checked> Dodawanie</label>
                <label class="check-item"><input type="checkbox" id="cSub" checked> Odejmowanie</label>
                <label class="check-item"><input type="checkbox" id="cMul"> Mnożenie</label>
                <label class="check-item"><input type="checkbox" id="cDiv"> Dzielenie</label>
                <label class="check-item"><input type="checkbox" id="cFrac"> Ułamki</label>
                <label class="check-item"><input type="checkbox" id="cPow"> Potęgi</label>
            </div>

            <button id="btnStart">ROZPOCZNIJ GRĘ</button>
        </div>

        <!-- EKRAN 2: GRA -->
        <div id="screen-game">
            <div class="stats">
                <span>⏰ <span id="txtTime">180</span>s</span>
                <span>⭐ <span id="txtScore">0</span></span>
            </div>

            <div id="txtQuestion" class="big-text">2 + 2 = ?</div>
            <div id="txtFeedback"></div>

            <input type="number" id="inpAnswer" placeholder="Wynik">
            <button id="btnCheck">SPRAWDŹ</button>
        </div>

        <!-- EKRAN 3: KONIEC -->
        <div id="screen-end">
            <h1>Koniec Gry!</h1>
            <p id="txtReason">Powód</p>
            <div class="big-text"><span id="txtFinalScore">0</span> pkt</div>
            <div id="rankingBox" style="text-align:left; font-size:14px; background:#f9f9f9; padding:10px; margin-bottom:10px;"></div>
            <button onclick="location.reload()">ZAGRAJ PONOWNIE</button>
        </div>

    </div>

        document.getElementById('btnStart').addEventListener('click', startGame);
        document.getElementById('btnCheck').addEventListener('click', checkAnswer);
        
        // Obsługa entera
        document.getElementById('inpAnswer').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkAnswer();
        });

        // --- FUNKCJA STARTOWA ---
        function startGame() {
            // 1. Sprawdź checkboxy
            allowedOps = [];
            if(document.getElementById('cAdd').checked) allowedOps.push('add');

            if(document.getElementById('cMul').checked) allowedOps.push('mul');
            if(document.getElementById('cDiv').checked) allowedOps.push('div');
            if(document.getElementById('cFrac').checked) allowedOps.push('frac');
            if(document.getElementById('cPow').checked) allowedOps.push('pow');

            if (allowedOps.length === 0) {
                alert("⚠️ Musisz zaznaczyć przynajmniej jedno działanie!");
                return;
            }

            // 2. Pobierz klasę
            level = parseInt(document.getElementById('selClass').value);

            // 3. Zmień ekran
            document.getElementById('screen-start').style.display = 'none';
            document.getElementById('screen-game').style.display = 'block';

            // 4. Uruchom grę
            time = 180;
            score = 0;
            updateStats();
            nextQuestion();
            
            // Timer
            timerInterval = setInterval(function() {
                time--;
                updateStats();
                if (time <= 0) endGame("Czas minął!");
            }, 1000);
        }
